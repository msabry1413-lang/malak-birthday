<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malak's Birthday Countdown 💗</title>
<style>
:root{--pink:#ff6fae;--purple:#a88bff;--text:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,#713f78 0,transparent 35%),radial-gradient(circle at 85% 80%,#253f79 0,transparent 35%),linear-gradient(135deg,#160f2b,#291431 55%,#111a35);overflow-x:hidden}
.card{width:min(760px,100%);text-align:center;padding:clamp(26px,6vw,58px);border:1px solid #ffffff35;border-radius:30px;background:#ffffff12;box-shadow:0 25px 90px #0005;backdrop-filter:blur(12px)}
.heart{font-size:48px;animation:pulse 1.5s infinite}
h1{font-size:clamp(2.3rem,7vw,4.8rem);line-height:1.05;margin:12px 0 16px;letter-spacing:-.04em}
h1 span{color:#ff9bc9}
.subtitle{color:#f4ddeb;font-size:clamp(1rem,2.5vw,1.2rem);line-height:1.7;max-width:570px;margin:0 auto 30px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:28px 0}
.unit{padding:20px 8px;border-radius:18px;background:#ffffff13;border:1px solid #ffffff20}
.num{display:block;font-size:clamp(1.8rem,5vw,3.2rem);font-weight:800;color:#fff}
.label{font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:#f6cfe4}
.message{font-size:1.05rem;color:#ffe1f0;margin-top:25px}
.footer{margin-top:30px;font-size:.9rem;color:#e7c7e1}
@keyframes pulse{50%{transform:scale(1.12)}}
@media(max-width:480px){.timer{gap:7px}.unit{padding:15px 4px}.label{font-size:.65rem}}
</style>
</head>
<body>
<main class="card">
  <div class="heart">💗</div>
  <h1>Malak’s Birthday<br><span>is almost here!</span></h1>
  <p class="subtitle">Someone as special as you deserves a day full of love, laughter, and beautiful surprises. The countdown is on!</p>
  <section class="timer" aria-label="Countdown">
    <div class="unit"><span class="num" id="days">00</span><span class="label">Days</span></div>
    <div class="unit"><span class="num" id="hours">00</span><span class="label">Hours</span></div>
    <div class="unit"><span class="num" id="minutes">00</span><span class="label">Minutes</span></div>
    <div class="unit"><span class="num" id="seconds">00</span><span class="label">Seconds</span></div>
  </section>
  <p class="message" id="message">Counting every moment until your birthday, Malak ✨💗</p>
  <div class="footer">Made especially for Malak, with love ♡</div>
</main>
<script>
const target = new Date('2026-10-26T00:00:00+03:00').getTime();
const pad = n => String(n).padStart(2,'0');
function updateCountdown(){
  let diff = target - Date.now();
  if(diff <= 0){
    ['days','hours','minutes','seconds'].forEach(id=>document.getElementById(id).textContent='00');
    document.getElementById('message').textContent='Happy Birthday, Malak! 🎂🎉 I hope your day is as beautiful as you are. 💗';
    document.querySelector('h1').innerHTML='Happy Birthday,<br><span>Malak! 🎉</span>';
    return;
  }
  const d=Math.floor(diff/86400000); diff%=86400000;
  const h=Math.floor(diff/3600000); diff%=3600000;
  const m=Math.floor(diff/60000); diff%=60000;
  const s=Math.floor(diff/1000);
  document.getElementById('days').textContent=pad(d);
  document.getElementById('hours').textContent=pad(h);
  document.getElementById('minutes').textContent=pad(m);
  document.getElementById('seconds').textContent=pad(s);
}
updateCountdown(); setInterval(updateCountdown,1000);
</script>
</body>
</html>
